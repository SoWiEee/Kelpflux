{{/*
Services for the Slurm cluster.

  - slurm-controller : headless Service for slurmctld; endpoints are published
                       only after the controller and slurmrestd are Ready.
  - slurm-restapi    : ClusterIP for slurmrestd on :6820, used by the operator
                       to query job/node state.
  - per-pool worker  : headless Service for StatefulSet identity.
  - per-node worker  : stable ClusterIP Service per Slurm node. Slurm caches
                       NodeAddr resolution, so it must not point at Pod IP DNS.
*/}}
---
apiVersion: v1
kind: Service
metadata:
  name: slurm-controller
  namespace: {{ .Values.cluster.namespace }}
  labels:
    {{- include "slurm-platform.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app: slurm-controller
  ports:
    - name: slurmctld
      port: 6817
      targetPort: 6817
---
apiVersion: v1
kind: Service
metadata:
  name: slurm-restapi
  namespace: {{ .Values.cluster.namespace }}
  labels:
    {{- include "slurm-platform.labels" . | nindent 4 }}
spec:
  selector:
    app: slurm-controller
  ports:
    - name: rest
      port: 6820
      targetPort: 6820
{{- range .Values.pools }}
{{- $pool := . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $pool.statefulset }}
  namespace: {{ $.Values.cluster.namespace }}
  labels:
    {{- include "slurm-platform.labels" $ | nindent 4 }}
    pool-id: {{ $pool.id }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: {{ $pool.appLabel }}
  ports:
    - name: slurmd
      port: 6818
      targetPort: 6818
{{- range $i, $_ := until (int $pool.maxNodes) }}
{{- $nodeName := printf "%s-%d" $pool.statefulset $i }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $nodeName }}-addr
  namespace: {{ $.Values.cluster.namespace }}
  labels:
    {{- include "slurm-platform.labels" $ | nindent 4 }}
    pool-id: {{ $pool.id }}
spec:
  selector:
    app: {{ $pool.appLabel }}
    statefulset.kubernetes.io/pod-name: {{ $nodeName }}
  ports:
    - name: slurmd
      port: 6818
      targetPort: 6818
{{- end }}
{{- end }}

suite: elastic operator
templates:
  - operator.yaml
tests:
  - it: operator RBAC is read-only for pods and writes only chart worker pools
    template: operator.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods/exec"]
            resourceNames: ["slurm-controller-0"]
            verbs: ["get", "create"]
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["statefulsets"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
            resources: ["statefulsets"]
            resourceNames:
              - "slurm-worker-cpu"
              - "slurm-worker-gpu-rtx4070"
              - "slurm-worker-gpu-rtx4080"
            verbs: ["patch"]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["pods"]
            verbs: ["get", "list", "watch", "create"]

  - it: PARTITIONS_JSON contains all configured pools
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="PARTITIONS_JSON")].value
          pattern: '"partition":"cpu"'
        documentSelector:
          path: kind
          value: Deployment
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="PARTITIONS_JSON")].value
          pattern: '"partition":"gpu-rtx4070"'
        documentSelector:
          path: kind
          value: Deployment
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="PARTITIONS_JSON")].value
          pattern: '"partition":"gpu-rtx4080"'
        documentSelector:
          path: kind
          value: Deployment

  - it: operator mounts the JWT secret for slurmrestd auth (mode=0400 for Slurm 23.11)
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: slurm-jwt-secret
            secret:
              secretName: slurm-jwt-secret
              defaultMode: 0400
        documentSelector:
          path: kind
          value: Deployment

  - it: drain timeout defaults reach the operator and each pool
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DRAIN_TIMEOUT_SECONDS
            value: "1800"
        documentSelector:
          path: kind
          value: Deployment

  - it: provisioning timeout and retry values reach the operator
    set:
      operator.provisioningTimeoutSeconds: 90
      operator.provisioningRetrySeconds: 120
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROVISIONING_TIMEOUT_SECONDS
            value: "90"
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PROVISIONING_RETRY_SECONDS
            value: "120"
        documentSelector:
          path: kind
          value: Deployment
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="PARTITIONS_JSON")].value
          pattern: '"cpus_per_node":4'
        documentSelector:
          path: kind
          value: Deployment
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="PARTITIONS_JSON")].value
          pattern: '"memory_mb_per_node":3500'
        documentSelector:
          path: kind
          value: Deployment
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="PARTITIONS_JSON")].value
          pattern: '"drain_timeout_seconds":1800'
        documentSelector:
          path: kind
          value: Deployment

  - it: drain timeout override reaches the operator and each pool
    set:
      operator.drainTimeoutSeconds: 600
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DRAIN_TIMEOUT_SECONDS
            value: "600"
        documentSelector:
          path: kind
          value: Deployment
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="PARTITIONS_JSON")].value
          pattern: '"drain_timeout_seconds":600'
        documentSelector:
          path: kind
          value: Deployment

  - it: event-driven reconciliation settings reach the operator
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SLURM_POLL_INTERVAL_SECONDS
            value: "5"
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RECONCILE_PERIOD_SECONDS
            value: "60"
        documentSelector:
          path: kind
          value: Deployment

  - it: operator Service exposes port 8000 for Prometheus scraping
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8000
        documentSelector:
          path: kind
          value: Service

  - it: fragmentation environment is disabled by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FRAGMENTATION_ENABLED
            value: "false"
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FRAGMENTATION_SHADOW_MODE
            value: "true"
        documentSelector:
          path: kind
          value: Deployment

  - it: fragmentation environment follows chart values
    set:
      operator.fragmentation.enabled: true
      operator.fragmentation.shadowMode: false
      operator.fragmentation.minIntervalSeconds: 30
      operator.fragmentation.maxRequeuesPerHour: 10
      operator.fragmentation.maxTargetsPerDecision: 2
      operator.fragmentation.priorityGap: 500
      operator.fragmentation.mpsPerNode: 200
      operator.fragmentation.partitions:
        - gpu-rtx4070
        - gpu-h100
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FRAGMENTATION_ENABLED
            value: "true"
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FRAGMENTATION_SHADOW_MODE
            value: "false"
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FRAGMENTATION_MIN_INTERVAL_SECONDS
            value: "30"
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FRAGMENTATION_MAX_REQUEUES_PER_HOUR
            value: "10"
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FRAGMENTATION_PRIORITY_GAP
            value: "500"
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FRAGMENTATION_MPS_PER_NODE
            value: "200"
        documentSelector:
          path: kind
          value: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FRAGMENTATION_PARTITIONS
            value: "gpu-rtx4070,gpu-h100"
        documentSelector:
          path: kind
          value: Deployment

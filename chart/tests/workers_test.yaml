suite: worker StatefulSets
templates:
  - workers.yaml
  - configmap-static.yaml
  - configmap-nodes.yaml
  - configmap-task-prolog.yaml
tests:
  - it: GPU pool gets nvidia runtimeClass + nvidia.com/gpu on k3s
    template: workers.yaml
    set:
      cluster.runtime: k3s
    asserts:
      - matchRegex:
          path: spec.template.spec.runtimeClassName
          pattern: "^nvidia$"
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx4070
      - matchRegex:
          path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
          pattern: "^1$"
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx4070

  - it: GPU pool gets NO nvidia runtime on kind (cluster.runtime != k3s)
    template: workers.yaml
    set:
      cluster.runtime: kind
    asserts:
      - isNull:
          path: spec.template.spec.runtimeClassName
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx4070

  - it: CPU pool never has GPU resources regardless of runtime
    template: workers.yaml
    set:
      cluster.runtime: k3s
    asserts:
      - isNull:
          path: spec.template.spec.runtimeClassName
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu
      - isNull:
          path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu

  - it: workers do NOT mount the JWT secret (controller+operator only)
    template: workers.yaml
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: slurm-jwt-secret
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: slurm-jwt-secret
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx4070

  - it: workers mount Lmod modulefiles
    template: workers.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: modulefile-gcc
            mountPath: /opt/modulefiles/gcc
            readOnly: true
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: modulefile-cuda
            mountPath: /opt/modulefiles/cuda
            readOnly: true
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx4070
      - contains:
          path: spec.template.spec.volumes
          content:
            name: modulefile-openmpi
            configMap:
              name: slurm-modulefile-openmpi
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu

  - it: workers carry checksum annotations for ConfigMap content
    template: workers.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/config-static"]
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu
      - exists:
          path: spec.template.metadata.annotations["checksum/config-nodes"]
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu

  - it: workers do not mount cgroup.conf in the baseline profile
    template: workers.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: slurm-config-static
            mountPath: /etc/slurm/cgroup.conf
            subPath: cgroup.conf
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu

  - it: worker resource requests and limits match the Slurm pool values
    template: workers.yaml
    set:
      cluster.runtime: k3s
    asserts:
      # CPU pool: 4 cpu / 3500Mi — Guaranteed QoS (requests == limits)
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "4"
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "4"
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "3500Mi"
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "3500Mi"
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu
      # GPU pool keeps nvidia.com/gpu alongside cpu/memory
      - equal:
          path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
          value: "1"
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx4070
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "4"
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx4070

  - it: workers use OnDelete so upgrades do not kill running jobs
    template: workers.yaml
    asserts:
      - equal:
          path: spec.updateStrategy.type
          value: OnDelete
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu
      - equal:
          path: spec.updateStrategy.type
          value: OnDelete
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx4070

  - it: slurmd command uses configured debug settings
    template: workers.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "slurmd -Dvvv"
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "exec slurmd -D -N"
        documentSelector:
          path: metadata.name
          value: slurm-worker-cpu

  - it: DRA MPS keepalive uses the image-baked CUDA helper, not shared Python
    template: workers.yaml
    values:
      - ../values-k3s.yaml
      - ../values-2x1.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "/usr/local/bin/mps-keepalive"
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx4070
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "/shared/py/bin/python3"
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx4070

  - it: task-prolog resume helper is omitted when fragmentation is disabled
    template: configmap-task-prolog.yaml
    asserts:
      - notExists:
          path: data["20-resume-helper.sh"]

  - it: task-prolog resume helper is present when fragmentation is enabled
    template: configmap-task-prolog.yaml
    set:
      operator.fragmentation.enabled: true
    asserts:
      - exists:
          path: data["20-resume-helper.sh"]
      - matchRegex:
          path: data["20-resume-helper.sh"]
          pattern: "resume_from_checkpoint"
      - matchRegex:
          path: data["20-resume-helper.sh"]
          pattern: "SLURM_RESUME_HELPER"

  - it: GPU pool has no nodeSelector by default (floating, backward-compatible)
    template: workers.yaml
    set:
      cluster.runtime: k3s
    asserts:
      - isNull:
          path: spec.template.spec.nodeSelector
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx4070

  - it: values-2x1 overlay pins each GPU pool to its physical host
    template: workers.yaml
    values:
      - ../values-k3s.yaml
      - ../values-2x1.yaml
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["gpu-host-class"]
          value: rtx4070
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx4070
      - equal:
          path: spec.template.spec.nodeSelector["gpu-host-class"]
          value: rtx3080
        documentSelector:
          path: metadata.name
          value: slurm-worker-gpu-rtx3080

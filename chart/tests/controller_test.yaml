suite: controller StatefulSet
templates:
  - controller.yaml
  - configmap-static.yaml
  - configmap-nodes.yaml
tests:
  - it: production controller reads the API token from a read-only secret mount
    template: controller.yaml
    values:
      - ../values-k3s.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RL_API_TOKEN_FILE
            value: /run/secrets/rl-scheduler/api-token
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.volumes
          content:
            name: rl-scheduler-api-token
            secret:
              secretName: rl-scheduler-api-token
              defaultMode: 0400
        documentSelector:
          path: kind
          value: StatefulSet

  - it: controller carries checksum annotations for ConfigMap content
    template: controller.yaml
    asserts:
      - exists:
          path: spec.template.metadata.annotations["checksum/config-static"]
        documentSelector:
          path: kind
          value: StatefulSet
      - exists:
          path: spec.template.metadata.annotations["checksum/config-nodes"]
        documentSelector:
          path: kind
          value: StatefulSet

  - it: controller mounts cgroup.conf only when cgroup support is enabled
    template: controller.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: slurm-config-static
            mountPath: /etc/slurm/cgroup.conf
            subPath: cgroup.conf
        documentSelector:
          path: kind
          value: StatefulSet

  - it: controller mounts cgroup.conf when proctrack/cgroup overlay is set
    template: controller.yaml
    set:
      slurm.proctrackType: proctrack/cgroup
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: slurm-config-static
            mountPath: /etc/slurm/cgroup.conf
            subPath: cgroup.conf
        documentSelector:
          path: kind
          value: StatefulSet

  - it: slurmctld command uses configured debug settings
    template: controller.yaml
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "slurmctld -Dvvv"
        documentSelector:
          path: kind
          value: StatefulSet
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "exec slurmctld -D &"
        documentSelector:
          path: kind
          value: StatefulSet

  - it: slurmrestd pins openapi version for Slurm 23.11
    template: controller.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "openapi/v0.0.39"
        documentSelector:
          path: kind
          value: StatefulSet

  - it: slurmrestd worker pool is bounded
    template: controller.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "slurmrestd -t 2 --max-connections 4"
        documentSelector:
          path: kind
          value: StatefulSet

  - it: controller bounds DNS retries for absent scale-to-zero nodes
    template: controller.yaml
    asserts:
      - contains:
          path: spec.template.spec.dnsConfig.options
          content:
            name: timeout
            value: "1"
        documentSelector:
          path: kind
          value: StatefulSet
      - contains:
          path: spec.template.spec.dnsConfig.options
          content:
            name: attempts
            value: "1"
        documentSelector:
          path: kind
          value: StatefulSet

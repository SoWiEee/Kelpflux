# =============================================================================
# slurm-platform — k3s + RTX 4070 production override (mps-migration verified)
# =============================================================================
# Layer over values.yaml:
#   helm install slurm-platform ./chart -f chart/values-k3s.yaml -n slurm
#
# Target configuration for the live Ubuntu 24.04 + k3s v1.35 + Slurm 23.11
# environment (RTX 4070 + driver 580).
# Stage A
# only renders slurm.conf / gres.conf — the other overrides here are inert
# until later stages wire them up.

cluster:
  runtime: k3s
  podSecurity: baseline
  # Slurm 23.11 workers need privileged host cgroup access. Keep audit/warn at
  # baseline while explicitly authorizing only this namespace's enforcement.
  podSecurityEnforce: privileged

# Stage D enables this; values.yaml::gpu-operator subchart override (driver +
# toolkit disabled) takes over because the host already has nvidia-driver-535 +
# nvidia-container-toolkit installed by setup-linux-gpu.sh.
gpu:
  enabled: true
  autoLabel: true

# Real GPU isolation needs the NVIDIA container runtime; the worker pod
# templates (Stage B) already gate `runtimeClassName: nvidia` on
# `cluster.runtime == "k3s"` AND `pool` having GPU gres.

# Storage on k3s defaults to the NFS subdir provisioner (LAN-mounted to host
# 192.168.0.111). Stage E wires this in; setting it now keeps the override
# stable.
storage:
  enabled: true
  mountInPods: true                  # /shared on controller/workers/login
  nfsServer: 192.168.0.111
  nfsPath: /srv/nfs/k8s

slurm:
  # Slurm 23.11 cgroup/v2 needs host systemd to create a delegated scope.
  # This enables hostPID + privileged host-cgroup access on worker pods only.
  # The namespace uses enforce=privileged with audit/warn=baseline; only the
  # worker templates request host-level permissions.
  workerHostCgroup: true
  slurmdParameters: config_overrides
  cgroup:
    plugin: autodetect
    ignoreSystemd: "no"
    ignoreSystemdOnFailure: "no"
    constrainCores: "yes"
    constrainRamSpace: "yes"
    constrainDevices: "yes"
    constrainSwapSpace: "no"

monitoring:
  enabled: true
  # Phase 7-A: OpenTelemetry distributed tracing.
  # Set otel.enabled: true to deploy Tempo + OTel Collector and wire Grafana.
  # Operator and rl-scheduler will auto-receive OTEL_ENABLED env when enabled.
  otel:
    enabled: true
    tempoStorage: "5Gi"

# Phase 7-B: SSH Login — expose login pod via NodePort so users can SSH in
# without kubectl. Add public keys under authorizedKeys (one per line).
# Connect with: ssh -p 30022 root@192.168.0.111
# Private key: ~/.ssh/slurm_login_key
login:
  ssh:
    nodePort: 30022
    # Paste your public key here (ssh-keygen -t ed25519 -f ~/.ssh/slurm_login_key)
    authorizedKeys: |
      # ssh-ed25519 AAAA... user@host
